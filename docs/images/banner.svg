<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="miBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22" />
      <stop offset="50%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <linearGradient id="miAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <pattern id="miGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
    <filter id="miGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#miBgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#miGrid)" />

  <!-- Ambient Glow -->
  <circle cx="1020" cy="110" r="160" fill="#10B981" opacity="0.15" filter="url(#miGlow)" />
  <circle cx="200" cy="280" r="140" fill="#34D399" opacity="0.10" filter="url(#miGlow)" />

  <!-- Top Status Badge -->
  <g transform="translate(80, 52)">
    <rect width="260" height="32" rx="16" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1" />
    <circle cx="16" cy="16" r="4.5" fill="#34D399" />
    <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#A7F3D0" letter-spacing="1.2">LOCAL-FIRST SMART MARKET · RC1</text>
  </g>

  <!-- Main Title & Narrative -->
  <g transform="translate(80, 142)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      Mercado Inteligente <tspan fill="url(#miAccentGrad)">RC1</tspan>
    </text>
    <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400" fill="#D1FAE5" letter-spacing="0.2">
      Comparador, Normalizador y Optimizador de Compras (Tiendas D1 · Éxito · Ara)
    </text>
    <text y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#6EE7B7">
      ASP.NET Core 10 Web API · Angular 20 Frontend · SQLite Local Persistence · PWA
    </text>
  </g>

  <!-- Key Metrics Row -->
  <g transform="translate(80, 260)">
    <rect x="0" y="0" width="180" height="46" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" font-weight="600" fill="#6EE7B7" text-transform="uppercase">PRIVACIDAD</text>
    <text x="16" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13.5" font-weight="700" fill="#F0FDF4">100% Local-First</text>

    <rect x="200" y="0" width="180" height="46" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" font-weight="600" fill="#6EE7B7" text-transform="uppercase">SUPERMERCADOS</text>
    <text x="16" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13.5" font-weight="700" fill="#FCD34D">D1 · Éxito · Ara</text>

    <rect x="400" y="0" width="180" height="46" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="10.5" font-weight="600" fill="#6EE7B7" text-transform="uppercase">OPTIMIZADOR</text>
    <text x="16" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13.5" font-weight="700" fill="#34D399">Canasta Óptima Multi-Tienda</text>
  </g>

  <!-- Right Graphic: Smart Shopping Basket -->
  <g transform="translate(900, 75)">
    <!-- Cart / Optimizer Graphic -->
    <rect x="0" y="0" width="220" height="190" rx="14" fill="rgba(4, 47, 46, 0.85)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1.5" />
    <circle cx="110" cy="70" r="38" fill="rgba(16, 185, 129, 0.2)" stroke="#34D399" stroke-width="2" />
    <!-- Shopping bag / tag icon -->
    <path d="M 98 62 L 122 62 L 128 85 L 92 85 Z" fill="none" stroke="#A7F3D0" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 104 62 C 104 54, 116 54, 116 62" fill="none" stroke="#A7F3D0" stroke-width="2" />
    <!-- Savings Bar -->
    <rect x="25" y="125" width="170" height="12" rx="6" fill="rgba(255, 255, 255, 0.08)" />
    <rect x="25" y="125" width="125" height="12" rx="6" fill="url(#miAccentGrad)" />
    <text x="25" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="12" font-weight="700" fill="#FCD34D">Ahorro Estimado: -32%</text>
    <text x="25" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="10" fill="#99F6E4">Optimizador heurístico</text>
  </g>
</svg>